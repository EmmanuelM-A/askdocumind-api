name: Run Unit Tests

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.12"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONPATH: .
      # Required config values so settings import does not fail in tests.
      # Unit tests never reach these services, so placeholders are enough.
      ENV: development
      PORT: "5000"
      DATABASE_URL: postgresql+asyncpg://ask_docu_mind:secret@localhost:5432/ask_docu_mind_postgres
      ANONYMOUS_TOKEN_SECRET: ci-anonymous-token-secret-32-chars-min
      ANONYMOUS_TOKEN_TTL_HOURS: "1"
      S3_ACCESS_KEY_ID: unused
      S3_SECRET_ACCESS_KEY: unused
      S3_BUCKET_NAME: askdocumind-uploads
      OPENAI_API_KEY: unused
      BRAVE_API_KEY: unused
      LLM_MODEL_NAME: gpt-4o-mini
      EMBEDDING_MODEL: text-embedding-3-small

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt

      - name: Run unit tests
        run: |
          pytest -q tests/unit --junitxml=unit-test-results.xml \
            --cov=src --cov-report=term-missing --cov-fail-under=35

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: unit-test-results.xml
