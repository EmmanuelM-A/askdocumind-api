name: Run Unit Tests

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.12"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # CPU-only torch build — avoids pulling ~800MB of unused nvidia-* CUDA
  # packages that the default Linux torch wheel drags in.
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONPATH: .
      # Required config values so settings import does not fail in tests
      ENV: development
      HOST: "0.0.0.0"
      PORT: "5000"
      DATABASE_URL: postgresql+asyncpg://ask_docu_mind:secret@localhost:5432/ask_docu_mind_postgres
      USER_SESSION_SECRET: test-user-session-secret
      ANON_SESSION_TTL_HOURS: "24"
      IS_WEB_SEARCH_ENABLED: "false"
      LLM_MODEL_NAME: gpt-4o-mini
      EMBEDDING_MODEL_NAME: text-embedding-3-small
      LLM_TEMPERATURE: "0.7"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        # --cov-fail-under is a regression floor, not a target: tests/unit only
        # exercises pure logic by design (repositories/DB/storage are covered by
        # tests/integration and tests/e2e instead), so this number is intentionally
        # well below "whole app" coverage. Raise it if coverage improves; don't
        # read it as the project's real test coverage.
        run: |
          pytest -q tests/unit --junitxml=unit-test-results.xml \
            --cov=src --cov-report=term-missing --cov-fail-under=35

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: unit-test-results.xml
