name: Run E2E Tests

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.12"
    secrets:
      OPENAI_API_KEY:
        required: true
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ask_docu_mind
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: ask_docu_mind_postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: .
      # Required config values so settings import does not fail in tests
      ENV: development
      PORT: "5000"
      DATABASE_URL: postgresql+asyncpg://ask_docu_mind:secret@localhost:5432/ask_docu_mind_postgres
      ANONYMOUS_TOKEN_SECRET: ci-anonymous-token-secret-32-chars-min
      ANONYMOUS_TOKEN_TTL_HOURS: "1"
      # MinIO started below. The app stores uploads in S3_BUCKET_NAME.
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: minio-admin
      S3_SECRET_ACCESS_KEY: minio-secret
      S3_REGION: us-east-1
      S3_BUCKET_NAME: askdocumind-uploads
      # Real key - e2e chatbot tests hit the actual OpenAI API, no mocking
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BRAVE_API_KEY: unused
      LLM_MODEL_NAME: gpt-4o-mini
      EMBEDDING_MODEL: text-embedding-3-small

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Started by hand because service containers cannot pass the
      # "server /data" command MinIO needs. minio/minio is no longer on
      # Docker Hub, so this uses Chainguard's build. It runs as root because
      # the image's non-root user cannot write to /data.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 --user 0 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            cgr.dev/chainguard/minio:latest server /data
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          docker logs minio
          exit 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          # CPU-only torch + torchvision, installed together first from their
          # own index so they don't get resolved together with the default
          # PyPI index (avoids "resolution-too-deep" from combining two
          # indices' full catalogs) — and so they come from the same matched
          # build pair, avoiding an ABI mismatch between them.
          uv pip install --system --index-url https://download.pytorch.org/whl/cpu torch==2.12.1 torchvision==0.27.1
          uv pip install --system -r requirements.txt

      - name: Run DB migrations
        run: alembic upgrade head

      - name: Create upload bucket
        run: |
          python - <<'EOF'
          import os
          import boto3

          boto3.client(
              "s3",
              endpoint_url=os.environ["S3_ENDPOINT_URL"],
              aws_access_key_id=os.environ["S3_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["S3_SECRET_ACCESS_KEY"],
              region_name=os.environ["S3_REGION"],
          ).create_bucket(Bucket=os.environ["S3_BUCKET_NAME"])
          EOF

      - name: Run e2e tests
        run: |
          pytest -q tests/e2e --junitxml=e2e-test-results.xml

      - name: Upload e2e test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e-test-results.xml
