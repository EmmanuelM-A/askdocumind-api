name: Run E2E Tests

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.12"
    secrets:
      OPENAI_API_KEY:
        required: true
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ask_docu_mind
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: ask_docu_mind_postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: .
      # Required config values so settings import does not fail in tests
      ENV: development
      HOST: "0.0.0.0"
      PORT: "5000"
      DATABASE_URL: postgresql+asyncpg://ask_docu_mind:secret@localhost:5432/ask_docu_mind_postgres
      USER_SESSION_SECRET: test-user-session-secret
      ANON_SESSION_TTL_HOURS: "24"
      IS_WEB_SEARCH_ENABLED: "false"
      # Real key - e2e chatbot tests hit the actual OpenAI API, no mocking
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_LLM_MODEL_NAME: gpt-4o-mini
      OPENAI_EMBEDDING_MODEL_NAME: text-embedding-3-small

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DB migrations
        run: alembic upgrade head

      - name: Run e2e tests
        run: |
          pytest -q tests/e2e --junitxml=e2e-test-results.xml

      - name: Upload e2e test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e-test-results.xml
