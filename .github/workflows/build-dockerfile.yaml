name: Build & Smoke Test Dockerfile

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  docker-build:
    name: Build & Smoke Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ask_docu_mind
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: ask_docu_mind_postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: askdocumind-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write container env file
        run: |
          cat > ci.env <<EOF
          ENV=production
          PORT=5000
          DATABASE_URL=postgresql+asyncpg://ask_docu_mind:secret@localhost:5432/ask_docu_mind_postgres
          ANONYMOUS_TOKEN_SECRET=ci-anonymous-token-secret-32-chars-min
          CORS_ORIGINS=["http://localhost:3000"]
          S3_ENDPOINT_URL=http://localhost:9000
          S3_ACCESS_KEY_ID=minio-admin
          S3_SECRET_ACCESS_KEY=minio-secret
          S3_REGION=us-east-1
          S3_BUCKET_NAME=askdocumind-uploads
          OPENAI_API_KEY=unused
          BRAVE_API_KEY=unused
          EOF

      # The app checks the upload bucket at startup, so it needs a real one.
      # Same pinned MinIO image as the e2e workflow.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 --user 0 \
            -e MINIO_ROOT_USER=minio-admin \
            -e MINIO_ROOT_PASSWORD=minio-secret \
            cgr.dev/chainguard/minio:latest@sha256:3b6e40c30ecd5cea627e382ff0b82ca841f58c52294578787043ee80c8ef7c82 server /data
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          docker logs minio
          exit 1

      - name: Create upload bucket
        run: |
          docker run --rm --network host --env-file ci.env \
            askdocumind-api:ci python -c '
          import os, boto3
          boto3.client(
              "s3",
              endpoint_url=os.environ["S3_ENDPOINT_URL"],
              aws_access_key_id=os.environ["S3_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["S3_SECRET_ACCESS_KEY"],
              region_name=os.environ["S3_REGION"],
          ).create_bucket(Bucket=os.environ["S3_BUCKET_NAME"])
          '

      - name: Run migrations
        run: |
          docker run --rm --network host --env-file ci.env \
            askdocumind-api:ci alembic upgrade head

      - name: Start container
        run: |
          docker run -d \
            --name askdocumind-ci \
            --network host \
            --env-file ci.env \
            askdocumind-api:ci

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5000/api/health/server; then
              echo ""
              echo "API is up"
              exit 0
            fi
            echo "Attempt $i: not ready yet, retrying in 3s..."
            sleep 3
          done
          echo "API failed to become ready"
          docker logs askdocumind-ci
          exit 1

      - name: Print container logs on failure
        if: failure()
        run: docker logs askdocumind-ci
