name: Build & Smoke Test Dockerfile

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  docker-build:
    name: Build & Smoke Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ask_docu_mind
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: ask_docu_mind_postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: askdocumind-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write container env file
        run: |
          cat > ci.env <<EOF
          ENV=production
          PORT=5000
          DATABASE_URL=postgresql+asyncpg://ask_docu_mind:secret@localhost:5432/ask_docu_mind_postgres
          ANONYMOUS_TOKEN_SECRET=ci-anonymous-token-secret-32-chars-min
          CORS_ORIGINS=["http://localhost:3000"]
          S3_ACCESS_KEY_ID=unused
          S3_SECRET_ACCESS_KEY=unused
          S3_BUCKET_NAME=askdocumind-uploads
          OPENAI_API_KEY=unused
          BRAVE_API_KEY=unused
          EOF

      - name: Run migrations
        run: |
          docker run --rm --network host --env-file ci.env \
            askdocumind-api:ci alembic upgrade head

      - name: Start container
        run: |
          docker run -d \
            --name askdocumind-ci \
            --network host \
            --env-file ci.env \
            askdocumind-api:ci

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5000/api/health/server; then
              echo ""
              echo "API is up"
              exit 0
            fi
            echo "Attempt $i: not ready yet, retrying in 3s..."
            sleep 3
          done
          echo "API failed to become ready"
          docker logs askdocumind-ci
          exit 1

      - name: Print container logs on failure
        if: failure()
        run: docker logs askdocumind-ci
