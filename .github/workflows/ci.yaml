name: CI Pipeline

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "alembic/**"
      - "requirements.txt"
      - "pytest.ini"
      - ".github/workflows/**"
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yaml
    with:
      python-version: "3.12"

  unit-tests:
    name: Unit Tests
    needs: lint
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    uses: ./.github/workflows/unit-tests.yaml
    with:
      python-version: "3.12"

  integration-tests:
    name: Integration Tests
    needs: unit-tests
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == 'main' &&
      github.event.pull_request.draft == false
    uses: ./.github/workflows/integration-tests.yaml
    with:
      python-version: "3.12"
    secrets: inherit

  # E2E tests disabled: shared DocumentConverter singleton in
  # src/api/services/service_factory.py (get_upload_service) is left in a
  # corrupted state after repeated conversions across tests in the same
  # process, causing cascading PydanticSerializationError failures in
  # document upload endpoints and leaked test data in unrelated chat tests.
  # Re-enable once the singleton/test-isolation issue is fixed.
  # e2e-tests:
  #   name: E2E Tests
  #   needs: integration-tests
  #   if: >-
  #     github.event_name == 'pull_request' &&
  #     github.base_ref == 'main' &&
  #     github.event.pull_request.draft == false
  #   uses: ./.github/workflows/e2e-tests.yaml
  #   with:
  #     python-version: "3.12"
  #   secrets: inherit

  docker-build:
    name: Docker Build
    needs: unit-tests
    uses: ./.github/workflows/build-dockerfile.yaml
    secrets: inherit