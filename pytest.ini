[pytest]
# Suppress FAISS SWIG deprecation warnings
filterwarnings =
    ignore::DeprecationWarning:importlib._bootstrap
    # Internal to docling's own PDF/OCR pipeline defaults, triggered by real
    # PDF parsing in e2e tests - not something our code calls directly.
    ignore::DeprecationWarning:docling.pipeline.standard_pdf_pipeline
    ignore::DeprecationWarning:docling.models.stages.ocr.rapid_ocr_model
asyncio_mode = auto
