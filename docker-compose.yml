services:
  database:
    image: pgvector/pgvector:pg16
    container_name: askdocumind_postgres
    environment:
      POSTGRES_USER: askdocumind
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: askdocumind_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

  minio:
    # minio/minio is no longer on Docker Hub. Chainguard's build runs as a
    # non-root user that cannot write to the volume, so run it as root.
    # Pinned by digest, because Chainguard's free images only publish `latest`.
    image: cgr.dev/chainguard/minio:latest@sha256:3b6e40c30ecd5cea627e382ff0b82ca841f58c52294578787043ee80c8ef7c82
    user: "0"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    container_name: askdocumind_minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: secretpassword
    volumes:
      - minio_data:/data
    restart: always

volumes:
  db_data:
  minio_data:
