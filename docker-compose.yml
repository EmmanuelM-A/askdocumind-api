services:
  database:
    image: pgvector/pgvector:pg16
    container_name: askdocumind_postgres
    environment:
      POSTGRES_USER: askdocumind
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: askdocumind_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

volumes:
  db_data:
