services:
  database:
    image: pgvector/pgvector:pg16
    container_name: askdocumind_postgres
    environment:
      POSTGRES_USER: askdocumind
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: askdocumind_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9001:9001"
    container_name: askdocumind_minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: secretpassword
    volumes:
      - minio_data:/data
    restart: always

volumes:
  db_data:
  minio_data:
